version: '3.8'

services:
  app:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: fintrack_app
    ports:
      - "3000:3000"
    depends_on:
      - db
      - redis
    env_file:
      - .env

  db:
    image: postgres:15-alpine
    container_name: fintrack_db
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-parolaniz}
      POSTGRES_DB: ${DB_NAME:-fintrack_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: fintrack_redis
    ports:
      - "6379:6379"

volumes:
  postgres_data: